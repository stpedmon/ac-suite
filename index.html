        if(j.error){ info.innerHTML='<span style="color:#b45309"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.125em"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> '+esc(j.error)+'</span>'; return; }
        const d=j.datos||{}; extracted=d;
        const setV=(id,val)=>{ const el=root.querySelector(id); if(el&&val!=null&&val!=="") el.value=val; };
        if(d.tipo){ const opt=[...root.querySelector("#dTipo").options].find(o=>o.value.toLowerCase()===String(d.tipo).toLowerCase()); if(opt) root.querySelector("#dTipo").value=opt.value; }
        setV("#dFecha",(d.fecha||"").slice(0,10));
        setV("#dProv",d.proveedor||d.cliente||"");
        setV("#dRef",d.numero||"");
        if(d.total!=null&&d.total!=="") setV("#dMonto",d.total);
        if(!root.querySelector("#dTit").value) setV("#dTit",[d.tipo,d.proveedor,d.numero].filter(Boolean).join(" ").trim()||file.name);
        const n=(d.items||[]).length;
        info.innerHTML='<span style="color:#15803d"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.125em"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg> Datos extraídos'+(n?(' · '+n+' ítem(s)'):'')+'. Revisa y guarda.</span>';
      }catch(e){ info.innerHTML='<span style="color:#b45309"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.125em"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> No se pudo extraer: '+esc(e.message)+'</span>'; }
    }
    async function extractOne(file){
      if(!r2On())return null;
      try{
        const u=r2Base()+"/extraer?token="+encodeURIComponent(A.cfg.cf_token)+"&type="+encodeURIComponent(file.type||"application/octet-stream");
        const res=await fetch(u,{method:"POST",body:file}); const j=await res.json();
        return j&&j.datos?j.datos:null;
      }catch(e){ return null; }
    }
    const esHoja=(f)=>{const n=(f.name||"").toLowerCase();const t=(f.type||"").toLowerCase();return n.endsWith(".xlsx")||n.endsWith(".xls")||n.endsWith(".csv")||t.includes("spreadsheet")||t.includes("excel")||t.includes("csv");};
    root.querySelector("#dFile").onchange=e=>manejarSeleccion([...e.target.files]);
    const dbtn=root.querySelector("#dDocBtn"); const dfd=root.querySelector("#dFileDoc");
    if(dbtn&&dfd){ dbtn.onclick=()=>dfd.click(); dfd.onchange=e=>manejarSeleccion([...e.target.files]); }
    function manejarSeleccion(files){
      if(!files.length)return;
      const drop=root.querySelector("#dDrop"); if(drop) drop.classList.add("has");
      const nm=root.querySelector("#dFileName"); const tw=root.querySelector("#dTitWrap");
      window._dSelFiles=files;
      if(files.length===1){ const f=files[0]; if(nm) nm.innerHTML='<b>'+esc(f.name)+'</b><span class="fd-sub">'+fmtSize(f.size)+'</span>'; if(tw) tw.style.display='';
        if(esHoja(f)){ extracted=null; const tp=root.querySelector("#dTipo"); const opt=[...tp.options].find(o=>o.value==="Lista de precios"); if(opt)tp.value="Lista de precios"; if(!root.querySelector("#dTit").value)root.querySelector("#dTit").value=f.name; info.innerHTML='<span class="muted" style="font-size:11.5px"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.125em"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg> Archivo Excel — se guardará sin análisis de IA.</span>'; }
        else doExtract(f);
      }
      else { extracted=null; if(nm) nm.innerHTML='<b>'+files.length+' archivos</b><span class="fd-sub">'+fmtSize(files.reduce((s,f)=>s+f.size,0))+' en total</span>'; if(tw) tw.style.display='none'; const hojas=files.filter(esHoja).length; info.innerHTML='<span class="muted" style="font-size:11.5px">Se subirán los '+files.length+' archivos.'+(hojas?' Los '+hojas+' Excel se guardan sin análisis.':'')+'</span>'; }
    }
    root.querySelector("[data-save]").onclick=async()=>{
      const err=root.querySelector("#dErr");
      const files=(window._dSelFiles&&window._dSelFiles.length)?window._dSelFiles:[...root.querySelector("#dFile").files];
      if(!files.length){ err.textContent="Selecciona uno o más archivos."; return; }
      for(const f of files){ if(f.size>90*1048576){ err.innerHTML='"'+esc(f.name)+'" pesa '+fmtSize(f.size)+'. Límite: 90 MB.<br>Tip: si el Excel tiene fotos de las piezas, guárdalo como CSV (solo precios) — pesará poquísimo. Las fotos ya están en tu tienda.'; return; } }
      const tipo=root.querySelector("#dTipo").value, fecha=root.querySelector("#dFecha").value;
      const proveedor=root.querySelector("#dProv").value.trim(), referencia=root.querySelector("#dRef").value.trim();
      const nota=root.querySelector("#dNota").value.trim(), monto=parseFloat(root.querySelector("#dMonto").value)||0;
      const single=files.length===1;
      A.saving++; touchSaving(); let done=0;
      for(const file of files){
        err.innerHTML='<span class="spin"></span> '+(single?'Subiendo…':('Analizando y subiendo '+(done+1)+'/'+files.length+'…'));
        let ex2=single?extracted:null;
        if(!single && r2On() && !esHoja(file)){ ex2=await extractOne(file); }
        let path="", store="sb";
        try{
          if(r2On()){
            const u=r2Base()+"/upload?token="+encodeURIComponent(A.cfg.cf_token)+"&name="+encodeURIComponent(file.name)+"&type="+encodeURIComponent(file.type||"application/octet-stream");
            const res=await fetch(u,{method:"POST",body:file});
            if(!res.ok) throw new Error("R2 "+res.status+(res.status===401?" (token incorrecto)":""));
            const j=await res.json(); path=j.key; store="r2";
          } else {
            const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
            path=tipo.toLowerCase()+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,6)+"_"+safe;
            const up=await sb.storage.from("ac-docs").upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
            if(up.error) throw new Error(up.error.message); store="sb";
          }
        }catch(ex){ A.saving=Math.max(0,A.saving-1);touchSaving(); err.textContent='Error al subir "'+file.name+'": '+ex.message; return; }
        let titulo=single?(root.querySelector("#dTit").value.trim()||file.name):file.name;
        if(!single && ex2){ const auto=[ex2.tipo,ex2.proveedor,ex2.numero].filter(Boolean).join(" ").trim(); if(auto)titulo=auto; }
        const payload={tipo,titulo,proveedor:(!single&&ex2&&(ex2.proveedor||ex2.cliente))?(ex2.proveedor||ex2.cliente):proveedor,referencia:(!single&&ex2&&ex2.numero)?ex2.numero:referencia,monto:single?monto:((ex2&&parseFloat(ex2.total))||0),fecha:(!single&&ex2&&ex2.fecha)?String(ex2.fecha).slice(0,10):fecha,path,store,filename:file.name,mime:file.type||"",size:file.size,nota};
        if(ex2){ payload.numero=ex2.numero||payload.referencia; payload.moneda=ex2.moneda||""; payload.subtotal=parseFloat(ex2.subtotal)||0; payload.impuestos=parseFloat(ex2.impuestos)||0; payload.datos=ex2; payload.extraido=true; }
        const r=await sb.from("ac_docs").insert(payload).select().single();
        if(r.error){ A.saving=Math.max(0,A.saving-1);touchSaving(); err.textContent='Error al registrar "'+file.name+'": '+r.error.message; return; }
        if(r.data)A.docs.unshift(r.data); done++;
      }
      A.saving=Math.max(0,A.saving-1); touchSaving();
      notifyDoc(single?("Nuevo: "+(root.querySelector("#dTit").value.trim()||files[0].name)):(files.length+" documentos subidos"));
      A.docUso=undefined; close(); render();
    };
  });
}
async function docDelete(id){
  const d=A.docs.find(x=>x.id===id); if(!d)return;
  if(!confirm("¿Eliminar este documento? Se borra el archivo permanentemente."))return;
  A.saving++; touchSaving();
  try{
    if(d.store==="r2"){ await fetch(r2Base()+"/file/"+d.path+"?token="+encodeURIComponent(A.cfg.cf_token),{method:"DELETE"}); }
    else { await sb.storage.from("ac-docs").remove([d.path]); }
  }catch(e){}
  await sb.from("ac_docs").delete().eq("id",id);
  A.saving=Math.max(0,A.saving-1); touchSaving();
  A.docs=A.docs.filter(x=>x.id!==id); A.docUso=undefined; render();
}

function importClientes(){
  openSheet(`
    <div class="row"><b style="font-size:15px">Importar clientes</b><button data-close style="margin-left:auto;border:none;background:none;font-size:20px;cursor:pointer"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.125em"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>

    </div>
    <input id="clFile" type="file" accept=".csv,text/csv" style="margin-bottom:8px"/>
    <label>…o pega el CSV</label>
    <textarea id="clText" style="height:110px;font-family:ui-monospace,monospace;font-size:11px" placeholder="First Name,Last Name,Email,Phone,...&#10;Juan,Pérez,juan@mail.com,+50760000000,..."></textarea>
    <div id="clInfo" style="font-size:12px;margin-top:8px;color:#6a6a6a"></div>
    <button class="btn btnGreen" style="width:100%;margin-top:10px" data-imp>Importar</button>
  `,(root,close)=>{
    let fileText="";
    root.querySelector("#clFile").onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ fileText=r.result; root.querySelector("#clInfo").textContent="Archivo cargado: "+f.name; }; r.readAsText(f); };
    root.querySelector("[data-imp]").onclick=async()=>{
      const info=root.querySelector("#clInfo");
      const text=(root.querySelector("#clText").value.trim()||fileText||"").trim();
      if(!text){ info.textContent="Sube un archivo o pega el CSV."; return; }
      let rows=[];
      try{ const wb=XLSX.read(text,{type:"string"}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}); }
      catch(err){ info.textContent="No se pudo leer el CSV."; return; }
      if(!rows.length){ info.textContent="El CSV está vacío."; return; }
      const get=(row,names)=>{ for(const n of names){ for(const k of Object.keys(row)){ if(k.toLowerCase().replace(/\s+/g,' ').trim()===n) return String(row[k]).trim(); } } return ""; };
      const existing=new Set(A.clientes.map(c=>(c.email||"").toLowerCase()).filter(Boolean));
      const seen=new Set(); const payload=[];
      for(const r of rows){
        const first=get(r,["first name","nombre"]), last=get(r,["last name","apellido"]);
        const nombre=[first,last].filter(Boolean).join(" ").trim() || get(r,["name","customer name","nombre completo"]);
        const email=get(r,["email","correo","e-mail"]).toLowerCase();
        const whatsapp=get(r,["phone","default address phone","telefono","teléfono","whatsapp","celular"]);
        const ciudad=get(r,["default address city","city","ciudad"]);
        const gastado=parseFloat(get(r,["total spent","total gastado"]).replace(/[^0-9.]/g,""))||0;
        const pedidos=parseInt(get(r,["total orders","orders count","pedidos"]))||0;
        if(!nombre&&!email&&!whatsapp) continue;
        if(email){ if(existing.has(email)||seen.has(email)) continue; seen.add(email); }
        payload.push({nombre,email,whatsapp,ciudad,origen:"Shopify",total_gastado:gastado,total_pedidos:pedidos});
      }
      if(!payload.length){ info.textContent="No hay clientes nuevos para importar (o ya están todos)."; return; }
      info.innerHTML='<span class="spin"></span> Importando '+payload.length+'…';
      for(let i=0;i<payload.length;i+=200){ const {error}=await sb.from("ac_clientes").insert(payload.slice(i,i+200)); if(error){ info.textContent="Error: "+error.message; return; } }
      close(); await loadAll(); A.view="clientes"; render();
    };
  });
}

  const s2=XLSX.utils.aoa_to_sheet(det);s2['!cols']=[{wch:10},{wch:10},{wch:9},{wch:24},{wch:20},{wch:44},{wch:20},{wch:11},{wch:11},{wch:12},{wch:11},{wch:8},{wch:9},{wch:13},{wch:28}];
  const s3=XLSX.utils.aoa_to_sheet(rev);s3['!cols']=[{wch:10},{wch:10},{wch:24},{wch:20},{wch:44},{wch:11},{wch:12},{wch:16},{wch:28}];

/* ═══ modal helper ═══ */
function openSheet(html,setup,opts){
  const ov=document.createElement("div");ov.className="overlay";
  const cls=(opts&&opts.wide)?"sheet sheetWide":"sheet";
  ov.innerHTML=`<div class="${cls}" onclick="event.stopPropagation()">${html}</div>`;
  const close=()=>{if(ov.parentNode)document.body.removeChild(ov);};
  ov.onclick=close;
  const root=ov.querySelector(".sheet");
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  document.body.appendChild(ov);
  if(setup)setup(root,close);
}

let lastSig={inv:"",cotiz:"",ventas:"",talleres:"",clientes:"",cat:""};
async function refresh(){
  if(A.saving>0||document.querySelector(".overlay"))return;
  const ae=document.activeElement;
  if(ae&&(/^q(Inv|Venta|Taller|Cliente|Doc|Kat)$/.test(ae.id||"")||/^(z|k|d|v|t|c|ob)/.test(ae.id||"")||ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT"))return;
  const y=scrollY; let changed=false;
  const chk=(data,key,apply)=>{ if(!data)return; const s=sigRows(data); if(s!==lastSig[key]){ lastSig[key]=s; apply(data); changed=true; } };
  try{
    if(A.view==="inventario"||A.view==="inicio"){
      const {data}=await sb.from("ac_items").select("*").order("order_id").order("seq");
      if(data){const s=sigInv(data);if(s!==lastSig.inv){lastSig.inv=s;A.inv.items=data;changed=true;}}
    }
    if(A.view==="cotizaciones"||A.view==="inicio"){

      chk(data,"cotiz",d=>{A.cotiz=d;});
    }
    if(A.view==="ventas"||A.view==="inicio"){

    if(A.view==="talleres"){ const {data}=await sb.from("ac_talleres").select("*").order("nombre"); chk(data,"talleres",d=>{A.talleres=d;}); }
    if(A.view==="clientes"){ const {data}=await sb.from("ac_clientes").select("*").order("updated_at",{ascending:false}); chk(data,"clientes",d=>{A.clientes=d;}); }
    if(A.view==="catalogo"){ const {data}=await sb.from("ac_catalogo").select("*").order("marca").order("modelo").order("pieza"); chk(data,"cat",d=>{A.cat=d;}); }
  }catch(e){}
  if(changed){ render(); scrollTo(0,y); }
}

async function faceLogin(fid){

    if(fid.pw){
      const {data,error}=await sb.auth.signInWithPassword({email:fid.email,password:_dec(fid.pw)});
      if(!error&&data&&data.user){ const um=data.user.user_metadata||{}; A.user={email:data.user.email,nombre:um.nombre||data.user.email.split("@")[0]}; loadAll(); return; }

    if(session){ const u=session.user,um=u.user_metadata||{}; A.user={email:u.email,nombre:um.nombre||u.email.split("@")[0]}; loadAll(); }
    else { if(le)le.textContent="Reactiva el acceso rápido: entra con contraseña y activa Face ID de nuevo."; }

      cont.innerHTML=data.map(x=>`<div class="card" style="padding:9px 11px;margin-bottom:6px"><div class="row" style="gap:8px"><b style="font-size:12.5px;flex:1">${esc(x.accion||'')}</b><span class="muted" style="font-size:10.5px;flex-shrink:0">${fdt(x.created_at)}</span></div><div class="muted" style="font-size:11px;margin-top:2px">${esc(x.modulo||'')}${x.detalle?' · '+esc(x.detalle):''} · ${esc(x.usuario||'')}</div></div>`).join('');

function changePass(){
  openSheet(`
    <div class="row"><b style="font-size:15px">Cambiar contraseña</b><button data-close style="margin-left:auto;border:none;background:none;font-size:20px;cursor:pointer"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.125em"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <label>Contraseña actual</label><input id="cpOld" type="password"/>
    <label>Nueva contraseña</label><input id="cpNew" type="password"/>
    <label>Repite la nueva</label><input id="cpNew2" type="password"/>
    <div id="cpe" style="color:#bb231e;font-size:12px;margin-top:8px"></div>
    <button class="btn btnGreen" style="width:100%;margin-top:12px" data-save>Guardar</button>
  `,(root,close)=>{
    root.querySelector("[data-save]").onclick=async()=>{
      const e=root.querySelector("#cpe");
      const oldp=root.querySelector("#cpOld").value, np=root.querySelector("#cpNew").value, np2=root.querySelector("#cpNew2").value;
      if(np.length<6){e.textContent="La nueva debe tener al menos 6 caracteres.";return;}
      if(np!==np2){e.textContent="Las nuevas no coinciden.";return;}
      e.innerHTML='<span class="spin"></span>';
      const v=await sb.auth.signInWithPassword({email:A.user.email,password:oldp});
      if(v.error){e.textContent="La contraseña actual es incorrecta.";return;}
      const {error}=await sb.auth.updateUser({password:np});
      if(error){e.textContent="Error: "+error.message;return;}
      close(); toast("✓ Contraseña actualizada");
    };
  });
}
async function boot(){
  const MAX_IDLE=12*60*60*1000; // 12 horas de inactividad
  let last=0; try{ last=parseInt(localStorage.getItem("ac_last")||"0"); }catch(e){}
  const idle=Date.now()-last;
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session&&last&&idle<MAX_IDLE){
      const u=data.session.user, um=u.user_metadata||{};
      A.user={email:u.email,nombre:um.nombre||u.email.split("@")[0]};
      try{localStorage.setItem("ac_last",String(Date.now()));}catch(e){}
      loadAll(); return;
    }
    if(data&&data.session&&last&&idle>=MAX_IDLE){ try{await sb.auth.signOut();}catch(e){} }
  }catch(e){}
  loginGate();
}
["click","keydown","visibilitychange"].forEach(ev=>document.addEventListener(ev,()=>{ if(A.user){ try{localStorage.setItem("ac_last",String(Date.now()));}catch(e){} } },{passive:true}));
/* ── a11y v108: navegación por teclado en elementos clickeables no-nativos ── */
(function(){
  const SEL="[data-act],[data-go],[data-copy]";
  const NATIVE={BUTTON:1,A:1,INPUT:1,SELECT:1,TEXTAREA:1,SUMMARY:1};
  function tagEl(el){
    if(!el||el.nodeType!==1)return;
    if(NATIVE[el.tagName])return;
    if(el.hasAttribute("tabindex"))return;
    el.setAttribute("tabindex","0");
    if(!el.hasAttribute("role"))el.setAttribute("role","button");
  }
  function scan(root){ try{ if(root.matches&&root.matches(SEL))tagEl(root); root.querySelectorAll&&root.querySelectorAll(SEL).forEach(tagEl); }catch(e){} }
  try{
    const obs=new MutationObserver(ms=>{ for(const m of ms){ m.addedNodes&&m.addedNodes.forEach(n=>scan(n)); } });
    obs.observe(document.body,{childList:true,subtree:true});
  }catch(e){}
  document.addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" "&&e.key!=="Spacebar")return;
    const el=document.activeElement;
    if(!el||NATIVE[el.tagName])return;
    if(!el.matches||!el.matches(SEL))return;
    e.preventDefault();
    el.click();
  });
  try{ scan(document.body); }catch(e){}
})();
/* ── v109: indicador de conexión ── */
(function(){
  let ban=null;
  function show(off){
    if(!off){ if(ban){ban.remove();ban=null;} return; }
    if(ban)return;
    ban=document.createElement("div");
    ban.setAttribute("role","status");
    ban.textContent="Sin conexión — los cambios podrían no guardarse";
    ban.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));background:#b45309;color:#fff;padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:600;z-index:9998;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center";
    document.body.appendChild(ban);
  }
  window.addEventListener("online",()=>show(false));
  window.addEventListener("offline",()=>show(true));
  try{ if(!navigator.onLine)show(true); }catch(e){}
})();
boot();
